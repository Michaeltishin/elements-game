<style>

  @keyframes slide2 { from { background-position: 0 0; } to { background-position: 200% 0; } }

  }
  .topbar button:hover {

    background: linear-gradient(180deg, rgba(var(--rgb), .6), rgba(var(--rgb), .24));

  }
  .mp {
    position: absolute; top: 76px; left: 50%; transform: translateX(-50%);

    background: linear-gradient(180deg, rgba(30,22,40,.92), rgba(10,10,16,.92));
    border: 1px solid rgba(255,95,168,.45); border-radius: 14px;
    box-shadow: 0 6px 26px rgba(0,0,0,.7), 0 0 18px rgba(255,95,168,.2);

<script>
'use strict';

const $ = id => document.getElementById(id);
const stage = $('stage');
const canvas = $('canvas');
const ctx = canvas.getContext('2d');

const CELL = 6;
const TICK_MS = 1000 / 60;

// ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ (объявлены ОДИН раз) =====
let cols = 0, rows = 0;
let grid, next, life, temp, tempBuf, spawnerType, aiMade, godMade;
let glowS, glowK, glowList;
let buf, bctx, img, px32;

// Элементы
const EMPTY=0, SAND=1, WATER=2, PLANT=3, FIRE=4, STONE=5, ICE=6, LAVA=7;
const SPAWNER=8, STEAM=9, OIL=10, ACID=11, GUNPOWDER=12, SMOKE=13, WIND=14;
const IRON=15, GOLD=16, MOLTEN_IRON=17, MOLTEN_GOLD=18;
const WALL=19;
const ELECTRIC_TOOL = 98;
const COOL_TOOL = 99;

const IS_STATIC = new Uint8Array(32);
[EMPTY, STONE, ICE, SPAWNER, WIND, IRON, GOLD, WALL].forEach(c => { IS_STATIC[c] = 1; });

const DX4 = [0, 0, -1, 1],  DY4 = [-1, 1, 0, 0];
const DX8 = [-1, 0, 1, -1, 1, -1, 0, 1], DY8 = [-1, -1, -1, 0, 0, 1, 1, 1];

const ELEMENTS = [
  {id:'sand',      name:'Песок',    cell:SAND},
  {id:'water',     name:'Вода',     cell:WATER},
  {id:'plant',     name:'Растение', cell:PLANT},
  {id:'stone',     name:'Камень',   cell:STONE},
  {id:'wall',      name:'Стена',    cell:WALL},
  {id:'iron',      name:'Железо',   cell:IRON},
  {id:'gold',      name:'Золото',   cell:GOLD},
  {id:'ice',       name:'Лёд',      cell:ICE},
  {id:'fire',      name:'Огонь',    cell:FIRE},
  {id:'lava',      name:'Лава',     cell:LAVA},
  {id:'oil',       name:'Масло',    cell:OIL},
  {id:'acid',      name:'Кислота',  cell:ACID},
  {id:'gunpowder', name:'Порох',    cell:GUNPOWDER},
  {id:'steam',     name:'Пар',      cell:STEAM},
  {id:'smoke',     name:'Дым',      cell:SMOKE},
  {id:'wind',      name:'Ветер',    cell:WIND},
  {id:'spawner',   name:'Спавнер',  cell:SPAWNER},
  {id:'electric',  name:'Молния',   cell:ELECTRIC_TOOL},
  {id:'cool',      name:'Холод',    cell:COOL_TOOL},
  {id:'erase',     name:'Ластик',   cell:EMPTY},
];

const CELL_MAP = {
  sand:SAND, water:WATER, plant:PLANT, stone:STONE, wall:WALL, iron:IRON, gold:GOLD, ice:ICE,
  fire:FIRE, lava:LAVA, oil:OIL, acid:ACID, gunpowder:GUNPOWDER,
  steam:STEAM, smoke:SMOKE, wind:WIND,
};

// Состояние
let tool = 'sand';
let brushSize = 2;
let mouseX = -100, mouseY = -100;
let sensorOn = false;
let loupeOn = false;
let paused = false;
let windX = 0;
let simTick = 0;
let stepCount = 0;
let explosionQueue = [];
let aiCursor = null;
const ais = [];
let isDrawing = false, lastPaintX = 0, lastPaintY = 0;

// Измерения
let dim = 0, holdStart = 0, holdLastIn = 0, holdProg = 0, portal = null, cloudOff = 0, bgT = 0;
let BGPIX = null, BG_SKY = null, BG_STAR = null, CLOUD = null, BG_FX = null;
const HOLD_TO = [30000, 30000, 30000, 30000], PORTAL_MS = 3000;
const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const SKY_PAL = [[10,8,34],[22,12,56],[42,18,84],[74,26,106],[116,36,112],[166,50,106],[214,78,96],[244,118,86],[255,166,98],[255,210,140]].map(c => pack(c[0], c[1], c[2]));

// Ад
let boss = null, SKULL_M = null;
let keyPickup = null, hasKey = false;
const BOSS_HP = 400, BOSS_IGNITE = 120;
const HELL_SKY = [[6,0,3],[22,2,8],[48,4,12],[84,8,14],[126,14,12],[172,28,10],[220,58,10],[250,100,14],[255,152,34],[255,204,84]].map(c => pack(c[0], c[1], c[2]));
const SKULL = [
  "....XXXXXXXX....", "..XXXXXXXXXXXX..", ".XXXXXXXXXXXXXX.", "XXXXXXXXXXXXXXXX", "XXXXXXXXXXXXXXXX",
  "XXEEEEXXXXEEEEXX", "XXEEEEXXXXEEEEXX", "XXEEEEXXXXEEEEXX", "XXXEEXXNNXXEEXXX", ".XXXXXXNNXXXXXX.",
  "..XXXXXXXXXXXX..", "...XXXXXXXXXX...", "...XTXTXTXTXX...", "...XTXTXTXTXX..."];
const GHOST = ["..XXXXXX..", ".XXXXXXXX.", "XXXXXXXXXX", "XEEXXXXEEX", "XEEXXXXEEX", "XXXXXXXXXX", ".XXXNNXXX.", "..XXXXXX..", "..XTXTXT..", "..XTXTXT.."];
const hell = { inited: false, next: 0, wave: null, eyes: [], faces: [], embers: [], lastT: 0 };
let hellE = 0, hellBand = 0;

// Золотые порталы и бог
let goldPortals = [];
let god = null;
let sunPos = null;

// Чёрная дыра
let bh = null, bhClicks = 0, bhLastClick = 0;
let bhStamp = null, bhTick = 0;
let bhCv = null, bhCx = null, bhImg = null, bhD32 = null, bhSize = 0;
const BH_PULL = 80;
const BH_K = 0.27, BH_RIN = 1.3, BH_ROUT = 4.2;
const BH_LUT = new Uint8Array(256 * 3);
let dR = 0, dG = 0, dB = 0, dA = 0;

// Электричество
const elec = { k: 0, bolts: [], lastBolt: 0, lastT: 0, targets: [] };
const zaps = new Map();
const isCond = g => g === WATER || g === IRON || g === GOLD;

// Миссии
let currentMission = 0, missionStartTick = 0, missionPlanted = false;
let missionState = 'run', missionProgress = 0;

// Утилиты
const rnd = n => Math.floor(Math.random() * n);
const idx = (x, y) => y * cols + x;

function defaultLife(c) {
  if (c === FIRE)  return 15 + rnd(10);
  if (c === PLANT) return 12;
  if (c === STEAM) return 100 + rnd(50);
  if (c === SMOKE) return 60 + rnd(40);
  return 0;
}
function defaultTemp(c) {
  switch (c) {
    case FIRE:  return 800;
    case LAVA:  return 5000;
    case ICE:   return -50;
    case STEAM: return 150;
    case SMOKE: return 100;
    default:    return 20;
  }
}
function setCell(i, c, l, t) {
  grid[i] = c;
  life[i] = (l === undefined) ? defaultLife(c) : l;
  temp[i] = (t === undefined) ? defaultTemp(c) : t;
  if (c !== SPAWNER) spawnerType[i] = 0;
  aiMade[i] = 0;
}
function clearCell(i, t) {
  grid[i] = EMPTY; life[i] = 0; temp[i] = (t === undefined) ? 20 : t; spawnerType[i] = 0; aiMade[i] = 0;
  if (godMade) godMade[i] = 0;
}

// ===== ЦВЕТА (упаковка) =====
function pack(r, g, b) { return (255 << 24) | (b << 16) | (g << 8) | r; }
function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function hex(h) { const c = hexRGB(h); return pack(c[0], c[1], c[2]); }
const BG_R = 0, BG_G = 0, BG_B = 0;
function mix(r, g, b, a) {
  return pack((BG_R + (r - BG_R) * a) | 0, (BG_G + (g - BG_G) * a) | 0, (BG_B + (b - BG_B) * a) | 0);
}

const C_BG = pack(BG_R, BG_G, BG_B);
const C_UNKNOWN = hex('#555555');
const C_FIRE = ['#ff3300', '#ff6600', '#ff9900', '#ffcc00', '#ffff00'].map(hex);
const C_STONE = ['#ff5533', '#aa6644', '#997755', '#888888'].map(hex);
const C_ICE = [hex('#c8eef8'), hex('#a8e0f0')];
const C_LAVA = ['#ffee44', '#ffaa00', '#ff7700', '#ff4400', '#cc3300'].map(hex);
const C_GUN = [hex('#ff4444'), hex('#661111'), hex('#333333')];

function fireColor(l) { return l > 18 ? C_FIRE[0] : l > 12 ? C_FIRE[1] : l > 7 ? C_FIRE[2] : l > 3 ? C_FIRE[3] : C_FIRE[4]; }
function iceColor(t) { return t > -10 ? C_ICE[0] : C_ICE[1]; }
function lavaColor(t) { return t > 4000 ? C_LAVA[0] : t > 3000 ? C_LAVA[1] : t > 2000 ? C_LAVA[2] : t > 1000 ? C_LAVA[3] : C_LAVA[4]; }

const SPAWNER_BASE = {
  0:'#555555', 1:'#e8c44c', 2:'#2f7fd4', 3:'#3ab54a', 4:'#ff6600', 5:'#888888',
  6:'#a8e0f0', 7:'#ff4400', 9:'#c8dcf0', 10:'#556633', 11:'#88ff44',
  12:'#333333', 13:'#888888', 14:'#96dcff', 15:'#969ca4', 16:'#ffcd28', 17:'#ff9a30', 18:'#ffd23c', 19:'#4b5480'
};
const SPAWNER_COL = new Int32Array(32).fill(C_UNKNOWN);
for (const k in SPAWNER_BASE) {
  const c = hexRGB(SPAWNER_BASE[k]);
  SPAWNER_COL[k] = (+k > 0)
    ? pack((c[0] + (136 - c[0]) * 0.3) | 0, (c[1] + (204 - c[1]) * 0.3) | 0, (c[2] + (255 - c[2]) * 0.3) | 0)
    : pack(c[0], c[1], c[2]);
}

function tempColor(t) {
  if (t < -100) return '#3399ff';
  if (t < 0) return '#66ccff';
  if (t < 100) return '#ffffff';
  if (t < 500) return '#ffff66';
  if (t < 1000) return '#ff9933';
  if (t < 3000) return '#ff6600';
  return '#ff3300';
}

const GLOW_T = [300, 600, 900, 1300, 1700, 2000];
const GLOW_C = [[110,30,20],[190,50,20],[240,100,20],[255,160,40],[255,210,90],[255,245,200]];
let gR = 0, gG = 0, gB = 0;
function glowAt(t) {
  const n = GLOW_T.length - 1;
  if (t <= GLOW_T[0]) { gR = GLOW_C[0][0]; gG = GLOW_C[0][1]; gB = GLOW_C[0][2]; return; }
  if (t >= GLOW_T[n]) { gR = GLOW_C[n][0]; gG = GLOW_C[n][1]; gB = GLOW_C[n][2]; return; }
  let k = 0;
  while (t > GLOW_T[k + 1]) k++;
  const f = (t - GLOW_T[k]) / (GLOW_T[k + 1] - GLOW_T[k]);
  const a = GLOW_C[k], b = GLOW_C[k + 1];
  gR = a[0] + (b[0] - a[0]) * f; gG = a[1] + (b[1] - a[1]) * f; gB = a[2] + (b[2] - a[2]) * f;
}
function moltenColor(c, t) {
  const p = Math.max(0, Math.min(1, (t - 1800) / 500));
  return c === MOLTEN_IRON
    ? pack(255, (140 + 95 * p) | 0, (40 + 150 * p) | 0)
    : pack(255, (200 + 40 * p) | 0, (30 + 90 * p) | 0);
}

function windDir(f) {
  if (f === undefined) f = 1;
  if (windX === 0) return Math.random() < 0.5 ? -1 : 1;
  const bias = Math.max(0.05, Math.min(0.95, 0.5 + windX * 0.08 * f));
  return Math.random() < bias ? 1 : -1;
}

// ===== ЗВУКИ =====
const SFX = { ac: null, master: null, noise: null, muted: false, last: {}, cnt: { fire: 0, lava: 0, water: 0 }, g: {}, o: {} };
function sfxInit() {
  if (SFX.ac) { if (SFX.ac.state === 'suspended') SFX.ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ac = SFX.ac = new AC();
  const comp = ac.createDynamicsCompressor();
  SFX.master = ac.createGain(); SFX.master.gain.value = SFX.muted ? 0 : 0.8;
  SFX.master.connect(comp); comp.connect(ac.destination);
  const len = ac.sampleRate * 2, nb = ac.createBuffer(1, len, ac.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  SFX.noise = nb;
  const loop = (ftype, f, q) => {
    const s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = ftype; fl.frequency.value = f; fl.Q.value = q || 1;
    const g = ac.createGain(); g.gain.value = 0;
    s.connect(fl); fl.connect(g); g.connect(SFX.master); s.start();
    return g;
  };
  SFX.g.fire = loop('lowpass', 700);
  SFX.g.lava = loop('lowpass', 150);
  SFX.g.sand = loop('bandpass', 2400, 0.5);
  SFX.g.flame = loop('bandpass', 650, 0.6);
  { const bo = ac.createOscillator(); bo.type = 'sawtooth'; bo.frequency.value = 118;
    const bf = ac.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 900; bf.Q.value = 2;
    const bg2 = ac.createGain(); bg2.gain.value = 0; bo.connect(bf); bf.connect(bg2); bg2.connect(SFX.master); bo.start();
    SFX.g.ball = bg2; SFX.o.ball = bo; }
  { const hg = ac.createGain(); hg.gain.value = 0;
    const hlp = ac.createBiquadFilter(); hlp.type = 'lowpass'; hlp.frequency.value = 240;
    [55, 77.8, 41.2].forEach((f, k) => {
      const o = ac.createOscillator(); o.type = k === 2 ? 'sine' : 'sawtooth'; o.frequency.value = f; o.detune.value = (k - 1) * 9;
      const og = ac.createGain(); og.gain.value = k === 2 ? 0.5 : 0.22; o.connect(og); og.connect(hlp); o.start();
    });
    const hl = ac.createOscillator(); hl.frequency.value = 0.09;
    const hlg = ac.createGain(); hlg.gain.value = 120; hl.connect(hlg); hlg.connect(hlp.frequency); hl.start();
    hlp.connect(hg); hg.connect(SFX.master); SFX.g.hell = hg; }
  const hum = ac.createGain(); hum.gain.value = 0;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 170;
  const a = ac.createOscillator(); a.type = 'sine'; a.frequency.value = 42;
  const b = ac.createOscillator(); b.type = 'sawtooth'; b.frequency.value = 63;
  const bg = ac.createGain(); bg.gain.value = 0.35;

function copyBottomLeft(src, sc, sr, dst, dc, dr) {
  const oy = dr - sr, w = Math.min(sc, dc);
  for (let y = 0; y < sr; y++) {
    const ty = y + oy;
    if (ty < 0 || ty >= dr) continue;
    for (let x = 0; x < w; x++) dst[ty * dc + x] = src[y * sc + x];
  }
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (w < CELL * 4 || h < CELL * 4) return;
  if (grid && w === canvas.width && h === canvas.height) return;

  const oc = cols, orr = rows, og = grid, ol = life, ot = temp, os = spawnerType, oa = aiMade, ogd = godMade;
  canvas.width = w; canvas.height = h;
  cols = Math.floor(w / CELL); rows = Math.floor(h / CELL);

  grid = new Uint8Array(cols * rows);
  next = new Uint8Array(cols * rows);
  life = new Int16Array(cols * rows);

  if (og) {

    copyBottomLeft(ol, oc, orr, life, cols, rows);
    copyBottomLeft(ot, oc, orr, temp, cols, rows);
    copyBottomLeft(os, oc, orr, spawnerType, cols, rows);
    copyBottomLeft(oa, oc, orr, aiMade, cols, rows);

  buf = document.createElement('canvas');
  buf.width = cols; buf.height = rows;

function drawPreview(cell) {
  const pc = document.createElement('canvas');
  pc.width = 48; pc.height = 34;
  const p = pc.getContext('2d');
  p.fillStyle = '#1e1e1e';
  p.fillRect(0, 0, 48, 34);

  if (cell === EMPTY) {
    p.strokeStyle = '#ff4444'; p.lineWidth = 3;
    p.beginPath();
    p.moveTo(12, 8); p.lineTo(36, 26);
    p.moveTo(36, 8); p.lineTo(12, 26);
    p.stroke();
    return pc;
  }
  if (cell === WALL) {
    p.fillStyle = '#2a2e48'; p.fillRect(0, 0, 48, 34);
    for (let row = 0; row < 6; row++) {
      const off = (row & 1) ? 6 : 0;
      for (let bx = -12 + off; bx < 48; bx += 12) {
        p.fillStyle = ((row + bx) % 3 === 0) ? '#5a6494' : '#4b5480';
        p.fillRect(bx + 1, row * 6 + 1, 10, 4);
      }
    }
    return pc;
  }
  if (cell === ELECTRIC_TOOL) {
    p.fillStyle = '#10142a'; p.fillRect(0, 0, 48, 34);
    const gr = p.createRadialGradient(24, 17, 1, 24, 17, 18);
    gr.addColorStop(0, 'rgba(160,230,255,0.9)'); gr.addColorStop(1, 'rgba(40,80,255,0)');
    p.fillStyle = gr; p.fillRect(0, 0, 48, 34);
    p.fillStyle = '#fff7a0'; p.shadowColor = '#7fdcff'; p.shadowBlur = 6;
    p.beginPath(); p.moveTo(27, 2); p.lineTo(15, 19); p.lineTo(23, 19); p.lineTo(19, 32); p.lineTo(34, 13); p.lineTo(25, 13); p.closePath(); p.fill();
    return pc;
  }
  if (cell === COOL_TOOL) {
    for (let yy = 0; yy < 34; yy++) {
      p.fillStyle = 'rgb(' + (27 + yy * 5) + ',' + (111 + yy * 3) + ',' + (181 + yy) + ')';
      p.fillRect(0, 33 - yy, 48, 1);
    }
    p.fillStyle = '#ffffff'; p.font = 'bold 16px Arial';
    p.fillText('0\u00b0', 14, 23);
    return pc;
  }
  if (cell === SPAWNER) {
    p.fillStyle = '#444'; p.fillRect(0, 0, 48, 34);
    p.fillStyle = '#666';
    for (let y = 2; y < 32; y += 5)
      for (let x = 2; x < 46; x += 5)
        if (Math.random() < 0.3) p.fillRect(x, y, 4, 4);
    p.fillStyle = '#88ccff';
    p.shadowColor = '#3399ff'; p.shadowBlur = 6;
    p.fillRect(21, 14, 6, 6);
    return pc;
  }
  if (cell === WIND) {
    for (let y = 0; y < 34; y++)
      for (let x = 0; x < 48; x++) {
        const v = (Math.sin(x * 0.3 + y * 0.2) * 0.5 + 0.5) * 0.4 + 0.1;
        p.fillStyle = 'rgba(150,220,255,' + v + ')';
        p.fillRect(x, y, 1, 1);
      }
    p.fillStyle = '#fff'; p.font = 'bold 14px Arial';
    p.fillText('~', 18, 22); p.fillText('~', 28, 22);
    return pc;
  }
  const ps = 4;
  for (let py = 0; py < 34; py += ps) {
    for (let px = 0; px < 48; px += ps) {
      const r = Math.random();
      let c;
      if (cell === FIRE)        c = r<.3?'#ff3300':r<.6?'#ff9900':'#ffcc00';
      else if (cell === LAVA)   c = r<.3?'#ffee44':r<.6?'#ff7700':'#cc3300';
      else if (cell === STONE)  c = r<.2?'#777':r<.5?'#888':'#999';
      else if (cell === SAND)   c = r<.2?'#d8b43c':r<.6?'#e8c44c':'#f0d45c';
      else if (cell === WATER)  c = r<.2?'#2770c4':r<.6?'#2f7fd4':'#378fe0';
      else if (cell === ICE)    c = r<.2?'#98d0e8':r<.6?'#a8e0f0':'#b8eaf8';
      else if (cell === PLANT)  c = r<.2?'#2aa53a':r<.6?'#3ab54a':'#4ac55a';
      else if (cell === STEAM)  c = r<.3?'#b0c8e0':r<.6?'#c8dcf0':'#d8e8f8';
      else if (cell === OIL)    c = r<.2?'#445522':r<.6?'#556633':'#667744';
      else if (cell === ACID)   c = r<.2?'#66dd22':r<.6?'#88ff44':'#aaff66';
      else if (cell === IRON)   c = r<.3?'#868c94':r<.6?'#969ca4':'#a6acb4';
      else if (cell === GOLD)   c = r<.3?'#e6b422':r<.6?'#ffcd28':'#ffe066';
      else if (cell === GUNPOWDER) c = r<.2?'#222':r<.5?'#333':'#444';
      else if (cell === SMOKE)  c = r<.3?'#555':r<.6?'#666':'#777';
      else c = '#555';
      p.fillStyle = c;
      p.fillRect(px, py, ps, ps);
    }
  }
  return pc;
}

// ===== РИСОВАНИЕ =====
function paintAt(px, py) {
  if (!tool) return;
  const cx = Math.floor(px / CELL), cy = Math.floor(py / CELL);
  if (cx < 0 || cx >= cols || cy < 0 || cy >= rows) return;
  if (tool === 'electric') return;

  if (tool === 'erase') {
    for (const a of ais.slice()) {
      const dx = px - a.x, dy = py - a.y;
      if (dx * dx + dy * dy < (brushSize * CELL + 12) ** 2) removeAI(a);
    }
    if (bh && !bh.dying) {
      const rh = bhBase() * bhEase(bh.scale), b = brushSize * CELL;
      const dx = px - bh.fx * canvas.width, dy = py - bh.fy * canvas.height;
      const ex = rh * 4.2 + b, ey = rh * 1.4 + b;
      if (dx * dx + dy * dy < (rh * 1.4 + b) ** 2 || (dx * dx) / (ex * ex) + (dy * dy) / (ey * ey) < 1) bh.dying = true;
    }
  }

  const r = brushSize;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = idx(x, y), g = grid[i];
      if (g === EMPTY) {
        let s = temp[i], cnt = 1;
        if (x > 0)        { s += temp[i - 1]; cnt++; }
        if (x < cols - 1) { s += temp[i + 1]; cnt++; }
        if (y > 0)        { s += temp[i - cols] * 1.3; cnt += 1.3; }
        if (y < rows - 1) { s += temp[i + cols] * 0.7; cnt += 0.7; }
        tempBuf[i] = s / cnt;
      } else if (CONDUCT[g] > 0) {
        const kS = CONDUCT[g];
        let T = temp[i], dT = 0;
        for (let k = 0; k < 4; k++) {
          const nx = x + DX4[k], ny = y + DY4[k];
          if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
          const ni = idx(nx, ny), nc = grid[ni], kn = CONDUCT[nc];
          if (kn > 0) dT += (kS < kn ? kS : kn) * (temp[ni] - T);
          else if (T > 20) {
            if (nc === EMPTY) dT -= AIR_LOSS * (T - 20);
            else if (nc === WATER) {
              dT -= WATER_LOSS * (T - 20);
              if (T > 300 && Math.random() < 0.02) queue(ni, STEAM, 150, 100 + rnd(50));
            }
          }
        }
        T += dT;
        if (T < 20) { T += 0.05; if (T > 20) T = 20; }
        tempBuf[i] = T;
        if (g === STONE && life[i] > 0) life[i]--;
        if (T >= MELT_T[g]) queue(i, MELT_TO[g], T);
      }
    }
  }
  temp.set(tempBuf);

  for (let i = 0; i < temp.length; i++) {
    if (grid[i] === EMPTY) {
      if (temp[i] > 20) { temp[i] -= 0.5; if (temp[i] < 20) temp[i] = 20; }
      else if (temp[i] < 20) { temp[i] += 0.05; if (temp[i] > 20) temp[i] = 20; }
    }
  }
  for (let k = 0; k < pcI.length; k++) setCell(pcI[k], pcC[k], pcL[k], pcT[k]);
}

const SPAWN_DX = [0, -1, 1, -1, 1], SPAWN_DY = [-1, -1, -1, 0, 0];
function updateSpawner(x, y, i) {
  const st = spawnerType[i];
  if (st === 0) return;
  if (Math.random() < 0.3) {
    for (let k = 0; k < 5; k++) {
      const nx = x + SPAWN_DX[k], ny = y + SPAWN_DY[k];
      if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
      const ni = idx(nx, ny);
      if (grid[ni] !== EMPTY) continue;
      setCell(ni, st);
      return;
    }
  }
}

function aiShift(dy) {
  if (!aiCursor || dy === 0) return;
  const ai = aiCursor;
  ai.y += dy * CELL; ai.tgt = null;
  for (const st of ai.structs) {
    st.cells = st.cells.filter(c => { c[1] += dy; return c[1] >= 0 && c[1] < rows && c[0] < cols; });

  }

function aiSetGoal(goal, thought, limit) {

}
function aiDone(thought) { aiSetGoal('think', thought, 25 + rnd(40)); }
function aiGo(tx, ty, k, maxV) {
  const ai = aiCursor;
  let vx = (tx - ai.x) * k, vy = (ty - ai.y) * k;
  const m = Math.sqrt(vx * vx + vy * vy);
  if (m > maxV) { vx *= maxV / m; vy *= maxV / m; }
  ai.vx = vx; ai.vy = vy; ai.x += vx; ai.y += vy;
  const dx = tx - ai.x, dy = ty - ai.y;
  return Math.sqrt(dx * dx + dy * dy);
}
function randCol() {
  const m = Math.min(50, Math.floor(cols / 4));
  return m + rnd(Math.max(1, cols - 2 * m));
}
function aiDanger() {
  const ai = aiCursor;
  const cx0 = Math.floor(ai.x / CELL), cy0 = Math.floor(ai.y / CELL);
  let d = 0;
  for (let dy = -8; dy <= 8; dy++) {
    for (let dx = -8; dx <= 8; dx++) {
      const nx = cx0 + dx, ny = cy0 + dy;
      if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
      const ni = idx(nx, ny), c = grid[ni];
      if (HAZARD[c] === 1) d++;
      else if (c === GUNPOWDER && life[ni] > 0) d += 5;
    }
  }
  return d;
}
function aiScan() {
  const sc = { plants: 0, userSolid: 0, gold: 0, iron: 0 };
  for (let i = 0; i < grid.length; i++) {
    if (aiMade[i]) continue;
    const g = grid[i];
    if (g === PLANT) sc.plants++;
    else if (g === GOLD) { sc.gold++; sc.userSolid++; }
    else if (g === IRON) { sc.iron++; sc.userSolid++; }
    else if (g === STONE || g === ICE || g === SPAWNER) sc.userSolid++;
  }
  return sc;
}
function aiCollect(pred) {
  const out = [];
  for (let i = 0; i < grid.length; i++) if (pred(i)) out.push(i);
  return out;
}
function aiCluster(cx, cy, r, W) {
  let n = 0;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r + 1) continue;
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
      const ci = idx(nx, ny);
      if (aiMade[ci] === 0) n += W[grid[ci]];
    }
  }
  return n;
}
function aiBestOf(list, r, tries, W) {
  let best = -1, bs = 0;
  for (let a = 0; a < tries; a++) {
    const ci = list[rnd(list.length)];
    const s = aiCluster(ci % cols, (ci / cols) | 0, r, W);
    if (s > bs) { bs = s; best = ci; }
  }
  return best;
}
function aiNearOwn(x, y, m) {
  for (const st of aiCursor.structs) {
    if (x >= st.x0 - m && x <= st.x1 + m && y >= st.y0 - m && y <= st.y1 + m) return true;
  }
  return false;
}
function aiThreat() {
  const ai = aiCursor;
  let best = null;
  for (const st of ai.structs) {
    const xa = Math.max(0, st.x0 - 7), xb = Math.min(cols - 1, st.x1 + 7);
    const ya = Math.max(0, st.y0 - 7), yb = Math.min(rows - 1, st.y1 + 7);
    let n = 0, sx = 0, sy = 0, src = -1;
    for (let y = ya; y <= yb; y++) {
      for (let x = xa; x <= xb; x++) {
        const ci = idx(x, y), g = grid[ci];
        if (HAZARD[g] === 1) { n++; sx += x; sy += y; }
        else if (g === SPAWNER && aiMade[ci] === 0 && (spawnerType[ci] === FIRE || spawnerType[ci] === LAVA)) {
          n += 6; sx += x * 6; sy += y * 6; src = ci;
        }
      }
    }
    if (n >= 4 && (!best || n > best.n)) best = { st: st, n: n, cx: Math.round(sx / n), cy: Math.round(sy / n), src: src };
  }
  return best;
}
function aiMissing(st) {
  const m = [];
  for (const c of st.cells) {
    if (c[0] < 0 || c[0] >= cols || c[1] < 0 || c[1] >= rows) continue;
    const g = grid[idx(c[0], c[1])];
    if (g === EMPTY || g === SMOKE || g === STEAM || g === WATER) m.push(c);
  }
  return m;
}
function aiDamaged() {
  const ai = aiCursor;
  for (let k = ai.structs.length - 1; k >= 0; k--) {
    const st = ai.structs[k];
    const m = aiMissing(st);
    if (st.done && m.length > st.cells.length * 0.6) { ai.structs.splice(k, 1); ai.forgot = st.name; continue; }
    if (m.length >= (st.done ? 3 : 1)) return { st: st, missing: m };
  }
  return null;
}
function aiChoose() {
  const ai = aiCursor;
  const note = ai.forgot ? ('Мой ' + ai.forgot + ' разрушен. Забудем. ') : '';
  ai.forgot = null;

  const th = aiThreat();
  if (th) {
    ai.threat = th;
    aiSetGoal('extinguish', 'Огонь рядом с моим зданием (' + th.st.name + ')! Тушу.', 420);
    return;
  }
  const dmg = aiDamaged();
  if (dmg && Math.random() < 0.8) { aiStartRepair(dmg); return; }

  const sc = aiScan();
  const opts = [];
  const add = (goal, w, why) => { opts.push({ goal: goal, w: goal === ai.last ? w * 0.25 : w, why: note + why }); };
  if (dim === 2 && boss && boss.state === 'active') {
    add('attackBoss', 8, 'Вижу огненного черепа! Бью током!');
  }
  if (sc.userSolid >= 4) add('demolish', 3 + Math.min(3, sc.userSolid / 80), 'Это построено не мной. Снесу.');
  if (sc.gold > 0) add('mine', 3, 'Вижу золото. Заберу себе.');
  else if (sc.iron > 0) add('mine', 1.5, 'Железо пригодится. Заберу.');
  if (sc.plants >= 8) add('burn', 1.2, 'Эта роща мне не нравится...');
  let totalStructs = 0;
  for (const a of ais) totalStructs += a.structs.length;
  if (ai.structs.length < MAX_STRUCTS && totalStructs < MAX_STRUCTS_ALL && simTick >= ai.nextBuild) {
    add('house', 1.2, 'Нужен дом. Ищу ровное место.');
    add('tower', 1, 'Построю башню: сверху будет видно всё.');
    add('garden', 1, 'Разобью сад с прудом.');
  }
  add('rest', 2, 'Пока всё спокойно. Подожду.');

  let tot = 0;
  for (const o of opts) tot += o.w;
  let r = Math.random() * tot, pick = opts[0];
  for (const o of opts) { r -= o.w; if (r <= 0) { pick = o; break; } }
  if (pick.goal === 'rest') { aiSetGoal('think', pick.why, 100 + rnd(160)); return; }
  ai.last = pick.goal;

  let ok = false;
  if (pick.goal === 'house' || pick.goal === 'tower' || pick.goal === 'garden') ok = aiStartBuild(pick.goal, pick.why);
  else if (pick.goal === 'demolish') ok = aiStartDemolish(pick.why);
  else if (pick.goal === 'mine') ok = aiStartMine(pick.why);
  else if (pick.goal === 'burn') ok = aiStartBurn(pick.why);
  else if (pick.goal === 'attackBoss') ok = aiStartAttackBoss(pick.why);
  if (!ok && ai.goal === 'think' && ai.timer >= ai.limit) aiDone('Не получилось. Подумаю ещё.');
}
function groundY(x) {
  for (let y = 0; y < rows; y++) {
    const g = grid[idx(x, y)];
    if (GAS[g] === 1) continue;
    if (g === WATER) {
      let yy = y;
      while (yy < rows && grid[idx(x, yy)] === WATER) yy++;
      if (yy - y > 4) return -1;
      if (yy >= rows) return rows;
      return SUPPORT[grid[idx(x, yy)]] === 1 ? yy : -1;
    }
    return SUPPORT[g] === 1 ? y : -1;
  }
  return rows;
}
function aiFindSite(w, hNeed) {
  for (let tries = 0; tries < 80; tries++) {
    const x0 = 3 + rnd(Math.max(1, cols - w - 8));
    if (x0 + w >= cols - 2) continue;
    const gy = [];
    let gmin = 1e9, gmax = -1, ok = true;
    for (let dx = 0; dx < w && ok; dx++) {
      const g = groundY(x0 + dx);
      if (g < 0) { ok = false; break; }
      gy.push(g);
      if (g < gmin) gmin = g;
      if (g > gmax) gmax = g;
    }
    if (!ok || gmax - gmin > 4) continue;
    if (gmin - hNeed < 3) continue;
    let clash = false;
    for (const a of ais) {
      for (const st of a.structs) if (x0 < st.x1 + 4 && x0 + w > st.x0 - 4) { clash = true; break; }
      if (clash) break;
    }
    if (clash) continue;
    return { x0: x0, w: w, base: gmin - 1, gy: gy };
  }
  return null;
}
function aiPut(arr, seen, x, y, t) {
  if (x < 1 || x >= cols - 1 || y < 1 || y >= rows) return;
  const k = y * cols + x;
  if (seen.has(k)) return;
  seen.add(k);
  arr.push([x, y, t]);
}
function planHouse(site) {
  const S = [], seen = new Set(), x0 = site.x0, w = site.w, b = site.base;
  const put = (x, y, t) => aiPut(S, seen, x, y, t);
  const h = 7 + rnd(5), top = b - h;
  for (let dx = 0; dx < w; dx++) {
    for (let y = b + 1; y < site.gy[dx]; y++) put(x0 + dx, y, STONE);
    put(x0 + dx, b, STONE);
  }
  for (let y = b - 1; y > top; y--) {
    if (y < b - 3) put(x0, y, STONE);
    if (y < top + 2 || y > top + 3) put(x0 + w - 1, y, STONE);
  }
  let xs = x0 - 1, xe = x0 + w, y = top;
  for (let x = xs; x <= xe; x++) put(x, y, IRON);
  xs++; xe--; y--;
  while (xs <= xe) {
    put(xs, y, IRON); put(xs + 1, y, IRON);
    put(xe, y, IRON); put(xe - 1, y, IRON);
    xs++; xe--; y--;
  }
  put(x0 + (w >> 1), y, GOLD);
  return { S: S, P: [], W: [] };
}
function planTower(site) {
  const S = [], seen = new Set(), x0 = site.x0, w = site.w, b = site.base;
  const put = (x, y, t) => aiPut(S, seen, x, y, t);
  const h = 22 + rnd(15), top = b - h;
  for (let dx = 0; dx < w; dx++) {
    for (let y = b + 1; y < site.gy[dx]; y++) put(x0 + dx, y, STONE);
    put(x0 + dx, b, STONE);
  }
  for (let y = b - 1; y > top; y--) {
    const lvl = Math.floor((b - y) / 7), rel = (b - y) % 7;
    const win = (rel === 3 || rel === 4);
    if (!(win && lvl % 2 === 0)) put(x0, y, STONE);
    if (!(win && lvl % 2 === 1)) put(x0 + w - 1, y, STONE);
    if (rel === 0) for (let dx = 1; dx < w - 1; dx++) put(x0 + dx, y, STONE);
  }
  for (let dx = -2; dx < w + 2; dx++) { put(x0 + dx, top, IRON); put(x0 + dx, top - 1, IRON); }
  for (let dx = -2; dx < w + 2; dx += 2) put(x0 + dx, top - 2, IRON);
  const cx = x0 + (w >> 1);
  for (let k = 3; k <= 7; k++) put(cx, top - k, IRON);
  put(cx, top - 8, GOLD);
  return { S: S, P: [], W: [] };
}
function planGarden(site) {
  const S = [], P = [], W = [], seen = new Set(), x0 = site.x0, w = site.w, b = site.base;
  const put = (x, y, t) => aiPut(S, seen, x, y, t);
  const d = 5;
  for (let dx = 0; dx < w; dx++) {
    for (let y = b + 1; y < site.gy[dx]; y++) put(x0 + dx, y, STONE);
    put(x0 + dx, b, STONE);
  }
  for (let y = b - 1; y >= b - d; y--) { put(x0, y, STONE); put(x0 + w - 1, y, STONE); }
  for (let side = -1; side <= 1; side += 2) {
    for (let k = 0; k < 6; k++) {
      const x = side < 0 ? x0 - 1 - k : x0 + w + k;
      if (x < 2 || x >= cols - 2) continue;
      const g = groundY(x);
      if (g < 2 || Math.random() < 0.3) continue;
      const hh = 1 + rnd(3);
      for (let j = 1; j <= hh; j++) aiPut(P, seen, x, g - j, PLANT);
    }
  }
  for (let y = b - 1; y > b - d; y--) for (let x = x0 + 1; x < x0 + w - 1; x++) W.push([x, y, WATER]);
  return { S: S, P: P, W: W };
}
function aiStartBuild(kind, why) {
  const ai = aiCursor;
  let w, hNeed, planner, name;
  if (kind === 'house') { w = 14 + rnd(9); hNeed = 12 + (w >> 1) + 3; planner = planHouse; name = 'дом'; }
  else if (kind === 'tower') { w = 5 + 2 * rnd(2); hNeed = 48; planner = planTower; name = 'башня'; }
  else { w = 14 + rnd(7); hNeed = 8; planner = planGarden; name = 'сад'; }
  const site = aiFindSite(w, hNeed);
  if (!site) { aiDone('Не нашёл ровного места (' + name + ').'); return false; }
  const pl = planner(site);
  pl.S.sort((a, c) => (c[1] - a[1]) || (a[0] - c[0]));
  const cells = pl.S.concat(pl.P).map(c => c.slice());
  let x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
  for (const c of cells) {
    if (c[0] < x0) x0 = c[0]; if (c[0] > x1) x1 = c[0];
    if (c[1] < y0) y0 = c[1]; if (c[1] > y1) y1 = c[1];
  }
  const st = { name: name, cells: cells, done: false, x0: x0, x1: x1, y0: y0, y1: y1 };
  ai.structs.push(st);
  if (ai.structs.length > 6) ai.structs.shift();
  ai.cur = st;
  ai.plan = pl.S.concat(pl.P, pl.W);
  ai.planPos = 0;
  aiSetGoal(kind, why, 4000);
  return true;
}
function aiStartRepair(dmg) {
  const ai = aiCursor;
  ai.cur = dmg.st;
  ai.plan = dmg.missing.slice().sort((a, c) => (c[1] - a[1]) || (a[0] - c[0]));
  ai.planPos = 0;
  aiSetGoal('repair', dmg.st.done ? ('Кто-то повредил мой ' + dmg.st.name + '. Чиню.') : ('Не достроил ' + dmg.st.name + '. Продолжаю.'), 4000);
}
function aiBuildTick() {
  const ai = aiCursor;
  if (ai.planPos >= ai.plan.length) {
    if (ai.cur) ai.cur.done = true;
    if (ai.goal === 'house' || ai.goal === 'tower' || ai.goal === 'garden') ai.nextBuild = simTick + BUILD_PAUSE + rnd(1800);
    aiDone('Готово: ' + (ai.cur ? ai.cur.name : 'постройка') + '.');
    return;
  }
  const it = ai.plan[ai.planPos];
  const d = aiGo(it[0] * CELL, it[1] * CELL, 0.35, 16);
  if (d < 40) {
    let n = 0;
    while (n < 3 && ai.planPos < ai.plan.length) {
      const p = ai.plan[ai.planPos];
      const ddx = p[0] * CELL - ai.x, ddy = p[1] * CELL - ai.y;
      if (ddx * ddx + ddy * ddy > 4900) break;
      const ci = idx(p[0], p[1]), g = grid[ci];
      if (g === EMPTY || g === SMOKE || g === STEAM || (g === WATER && p[2] !== WATER)) {
        setCell(ci, p[2]);
        if (p[2] !== WATER) aiMade[ci] = 1;
        n++;
      }
      ai.planPos++;
    }

function bytesToB64(u8) {
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}
function b64ToBytes(b64) {
  const s = atob(b64);
  const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}
function saveState() {
  const b = $('btn-save');
  try {
    const t16 = Int16Array.from(temp, v => Math.max(-32768, Math.min(32767, Math.round(v))));
    const d = {
      v: 2, cols: cols, rows: rows,
      grid: bytesToB64(grid),
      life: bytesToB64(new Uint8Array(life.buffer, life.byteOffset, life.byteLength)),
      temp: bytesToB64(new Uint8Array(t16.buffer)),
      sp: bytesToB64(spawnerType),
      am: bytesToB64(aiMade)
    };
    localStorage.setItem('elements_save', JSON.stringify(d));
    flash(b, 'Сохранено!');
  } catch (e) {
    console.error(e);
    flash(b, 'Ошибка сохранения');
  }
}
function loadState() {
  const b = $('btn-load');
  try {
    const raw = localStorage.getItem('elements_save');
    if (!raw) { flash(b, 'Нет сохранения'); return; }
    const d = JSON.parse(raw);
    let g, l, t, sp;
    if (d.v === 2) {
      g = b64ToBytes(d.grid);
      l = new Int16Array(b64ToBytes(d.life).buffer);
      t = new Int16Array(b64ToBytes(d.temp).buffer);
      sp = b64ToBytes(d.sp);
    } else {
      g = d.grid; l = d.life; t = d.temp; sp = d.spawnerType;
    }
    if (g.length !== d.cols * d.rows) throw new Error('Повреждённое сохранение');
    grid.fill(0); life.fill(0); temp.fill(20); spawnerType.fill(0); aiMade.fill(0); godMade.fill(0);
    copyBottomLeft(g, d.cols, d.rows, grid, cols, rows);
    copyBottomLeft(l, d.cols, d.rows, life, cols, rows);
    copyBottomLeft(t, d.cols, d.rows, temp, cols, rows);
    copyBottomLeft(sp, d.cols, d.rows, spawnerType, cols, rows);
    if (d.am) copyBottomLeft(b64ToBytes(d.am), d.cols, d.rows, aiMade, cols, rows);
    explosionQueue = [];
    forEachAI(() => { aiCursor.structs = []; aiCursor.plan = []; aiCursor.planPos = 0; aiCursor.cur = null; aiSetGoal('think', 'Мир изменился. Осматриваюсь.', 40); });
    flash(b, 'Загружено!');
  } catch (e) {
    console.error(e);
    flash(b, 'Ошибка загрузки');
  }
}

const MISSIONS = [
  {id: 0, name: 'Нет', desc: '', check: function() { return 0; }},
  {id: 1, name: 'Сохрани растение',
   desc: 'Посади растение и защити его от огня 30 секунд.',
   check: function(t) {
     let pc = 0;
     for (let i = 0; i < grid.length; i++) if (grid[i] === PLANT) pc++;
     if (!missionPlanted) {
       if (pc === 0) return 0;
       missionPlanted = true; missionStartTick = t;
     }
     if (pc === 0) return -1;
     const el = (t - missionStartTick) / 60;
     return el >= 30 ? 1 : el / 30;
   }},
  {id: 2, name: 'Создай водопад',
   desc: 'Поток воды шириной 10+ и высотой 30+ клеток.',
   check: function() {
     for (let x = 0; x < cols; x++) {
       let run = 0;
       for (let y = 0; y < rows; y++) {
         if (grid[idx(x, y)] === WATER) run++; else run = 0;
         if (run >= 30) {
           let w = 0;
           for (let dx = -5; dx <= 5; dx++) {
             const nx = x + dx;
             if (nx >= 0 && nx < cols && grid[idx(nx, y)] === WATER) w++;
           }
           if (w >= 10) return 1;
         }
       }
     }
     return 0;
   }},
  {id: 3, name: 'Построй башню',
   desc: 'Каменная башня высотой 40+ клеток, шириной 3-8.',
   check: function() {
     for (let x = 0; x < cols; x++) {
       let run = 0;
       for (let y = 0; y < rows; y++) {
         if (grid[idx(x, y)] === STONE) run++; else run = 0;
         if (run >= 40) {
           const my = y - 20;
           let l = x, r = x;
           while (l > 0 && grid[idx(l - 1, my)] === STONE) l--;
           while (r < cols - 1 && grid[idx(r + 1, my)] === STONE) r++;
           const w = r - l + 1;
           if (w >= 3 && w <= 8) return 1;
         }
       }
     }
     return 0;
   }},
];
function restartMission() {
  missionState = 'run'; missionProgress = 0; missionPlanted = false;
  missionStartTick = simTick;
  updateMissionProgress();
}
function cycleMission() {
  currentMission = (currentMission + 1) % MISSIONS.length;
  const m = MISSIONS[currentMission];
  $('btn-mission').textContent = '\u{1F3AF} Миссия: ' + m.name.toLowerCase();
  const p = $('missionPanel');
  if (currentMission === 0) { p.style.display = 'none'; return; }
  p.style.display = 'block';
  $('mpName').textContent = m.name;
  $('mpDesc').textContent = m.desc;
  restartMission();
}
function updateMissionProgress() {
  if (currentMission === 0) return;
  const m = MISSIONS[currentMission];
  if (missionState === 'run') {
    const pr = m.check(simTick);
    if (pr === -1) missionState = 'fail';
    else if (pr >= 1) missionState = 'done';
    else missionProgress = pr;
  }
  const f = $('mpFill'), s = $('mpStatus');
  if (missionState === 'fail') {
    f.style.width = '100%'; f.style.background = 'linear-gradient(90deg,#ff3333,#ff6633)';
    s.textContent = 'Растение погибло! Нажми на панель, чтобы начать заново.'; s.style.color = '#ff6666';

    f.style.background = 'linear-gradient(90deg,#33ff66,#3399ff)';

function drawLoupe() {

function scanGoldPortals() {
  const out = [];
  const seen = new Uint8Array(grid.length);
  for (let y = 0; y < rows - 3; y++) {
    for (let x = 0; x < cols - 3; x++) {
      const i = idx(x, y);
      if (grid[i] !== GOLD || seen[i]) continue;
      if (grid[idx(x + 1, y)] !== GOLD || grid[idx(x, y + 1)] !== GOLD) continue;
      let W = 1;
      while (x + W < cols && grid[idx(x + W, y)] === GOLD) W++;
      let H = 1;
      while (y + H < rows && grid[idx(x, y + H)] === GOLD) H++;
      if (W < 4 || H < 4) continue;
      let ok = true;
      for (let dx = 0; dx < W && ok; dx++) {
        if (grid[idx(x + dx, y)] !== GOLD) ok = false;
        else if (grid[idx(x + dx, y + H - 1)] !== GOLD) ok = false;
      }
      if (!ok) continue;
      for (let dy = 0; dy < H && ok; dy++) {
        if (grid[idx(x, y + dy)] !== GOLD) ok = false;
        else if (grid[idx(x + W - 1, y + dy)] !== GOLD) ok = false;
      }
      if (!ok) continue;
      let water = 0, total = 0;
      for (let dy = 1; dy < H - 1; dy++) {
        for (let dx = 1; dx < W - 1; dx++) {
          total++;
          if (grid[idx(x + dx, y + dy)] === WATER) water++;
        }
      }
      if (total === 0 || water < total * 0.5) continue;
      out.push({
        fx0: x,           fy0: y,
        fx1: x + W - 1,   fy1: y + H - 1,
        x0: x + 1,        y0: y + 1,
        x1: x + W - 2,    y1: y + H - 2
      });
      for (let dx = 0; dx < W; dx++) { seen[idx(x + dx, y)] = 1; seen[idx(x + dx, y + H - 1)] = 1; }
      for (let dy = 0; dy < H; dy++) { seen[idx(x, y + dy)] = 1; seen[idx(x + W - 1, y + dy)] = 1; }
    }
  }
  return out;
}

  while (gy < rows - 1 && (grid[idx(cx, gy + 1)] === EMPTY || grid[idx(cx, gy + 1)] === SMOKE ||
                            grid[idx(cx, gy + 1)] === STEAM || grid[idx(cx, gy + 1)] === WATER)) gy++;
  const base = gy;
  if (base < 25) { godSetGoal('wander', 'Низко здесь, нужно больше места.', 60); return; }
  let built = 0;
  const halfW = 8;
  const tiers = 5;
  const put = (x, y) => {
    if (x < 0 || x >= cols || y < 0 || y >= rows) return;
    const i = idx(x, y);
    const c = grid[i];
    if (c === EMPTY || c === SMOKE || c === STEAM || c === WATER) {
      setCell(i, GOLD);
      godMade[i] = 1;
      built++;
    }
  };
  for (let dx = -halfW - 2; dx <= halfW + 2; dx++) {
    put(cx + dx, base);
    put(cx + dx, base - 1);
  }
  for (let tier = 0; tier < tiers; tier++) {
    const hw = halfW - tier * 2;
    if (hw < 0) break;
    const y0 = base - 2 - tier * 3;
    for (let dx = -hw; dx <= hw; dx++) {
      put(cx + dx, y0);
      put(cx + dx, y0 - 1);
    }
  }
  const colH = 14;
  const xs = [cx - halfW - 1, cx + halfW + 1];
  for (const sx of xs) {
    for (let y = base - colH; y <= base; y++) put(sx, y);
    put(sx - 1, base - colH);
    put(sx + 1, base - colH);
    put(sx, base - colH - 1);
  }
  const topY = base - 2 - tiers * 3 - 2;
  for (let j = 0; j < 8; j++) {
    put(cx, topY - j);
    if (j < 4) { put(cx - 1, topY - j); put(cx + 1, topY - j); }
  }
  put(cx - 2, topY - 8); put(cx + 2, topY - 8);
  put(cx - 1, topY - 9); put(cx, topY - 9); put(cx + 1, topY - 9);

  g.shrines.push({ x0: cx - halfW - 3, x1: cx + halfW + 3, y0: topY - 12, y1: base + 2 });
  if (g.shrines.length > 5) g.shrines.shift();

  g.builds += built;
  godSetGoal('wander', 'Величественный храм воздвигнут. +' + built + ' золота.', 400 + rnd(400));
}
function godBless() {
  const g = god;
  if (mouseX < 0) { godSetGoal('wander', '', 100); return; }
  const d = godMove(mouseX + 50, mouseY - 50, 0.08, 9);
  if (d < 70 && g.timer % 14 === 0) {
    const cx = Math.floor(mouseX / CELL) + rnd(11) - 5;
    const cy = Math.floor(mouseY / CELL) + rnd(11) - 5;
    if (cx >= 0 && cx < cols && cy >= 0 && cy < rows) {
      const i = idx(cx, cy);
      if (grid[i] === EMPTY || grid[i] === SMOKE || grid[i] === STEAM) { setCell(i, GOLD); godMade[i] = 1; }
    }
  }
  if (g.timer >= g.limit) godSetGoal('wander', 'Благословляю тебя, дитя.', 100 + rnd(120));
}
function godChoose() {
  const g = god;
  if (ais.length > 0) {
    let best = null, bestD = 1e18;
    for (const a of ais) {
      const d = Math.hypot(a.x - g.x, a.y - g.y);
      if (d < bestD) { bestD = d; best = a; }
    }
    g.target = best;
    godSetGoal('smite', 'Изыди, нечестивый ИИ-' + best.id + '!', 900);
    return;
  }
  const opts = [
    { goal: 'build', w: 3, why: 'Воздвигну храм во славу мою.' },
    { goal: 'bless', w: 2, why: 'Одарю верного золотом.' },
    { goal: 'wander', w: 1, why: 'Наблюдаю за миром.' }
  ];
  let tot = 0;
  for (const o of opts) tot += o.w;
  let r = Math.random() * tot;
  for (const o of opts) {
    r -= o.w;
    if (r <= 0) { godSetGoal(o.goal, o.why, 300 + rnd(300)); return; }
  }
}
function updateGod() {
  if (!god) return;
  const g = god;
  g.timer++;
  g.haloPhase += 0.08;
  g.trail.push({ x: g.x, y: g.y });
  if (g.trail.length > 20) g.trail.shift();
  switch (g.goal) {
    case 'descend': {
      const d = godMove(canvas.width * 0.5, canvas.height * 0.35, 0.05, 6);
      if (d < 40 || g.timer >= g.limit) godSetGoal('wander', 'Я здесь. Наблюдаю.', 60);
      break;
    }
    case 'wander': {
      if (!g.target || g.timer % 100 === 0) {
        g.target = { x: canvas.width * (0.1 + Math.random() * 0.8), y: canvas.height * (0.15 + Math.random() * 0.35) };
      }
      godMove(g.target.x, g.target.y, 0.03, 5);
      if (g.timer >= g.limit) godChoose();
      break;
    }
    case 'smite': {
      if (!g.target || !ais.includes(g.target)) {
        if (ais.length > 0) g.target = ais[0];
        else { godSetGoal('wander', 'Нечестивцев не осталось.', 100); break; }
      }
      godSmite(g.target);
      break;
    }
    case 'build':   godBuildShrine(); break;
    case 'bless':   godBless(); break;
  }
  const mg = 30;
  if (g.x < mg) g.x = mg;
  if (g.x > canvas.width - mg) g.x = canvas.width - mg;
  if (g.y < mg) g.y = mg;
  if (g.y > rows * CELL - CELL) g.y = rows * CELL - CELL;
}
function updateGodAnger() {
  if (!god || dim !== 3) return;
  const g = god;
  let destroyed = 0, lavaNear = 0, fireNear = 0;
  for (let i = 0; i < grid.length; i++) {
    if (godMade[i] !== 1) continue;
    if (grid[i] !== GOLD) { destroyed++; continue; }
    const x = i % cols, y = (i / cols) | 0;
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
        const c = grid[ny * cols + nx];
        if (c === LAVA || c === MOLTEN_GOLD || c === MOLTEN_IRON) lavaNear++;
        else if (c === FIRE) fireNear++;
      }
    }
  }
  if (destroyed > 0) {
    g.anger += destroyed * 6;
    for (let i = 0; i < grid.length; i++) if (godMade[i] === 1 && grid[i] !== GOLD) godMade[i] = 0;
  }
  if (lavaNear > 0) g.anger += Math.min(lavaNear, 20) * 0.8;
  if (fireNear > 0) g.anger += Math.min(fireNear, 30) * 0.15;
  if (destroyed === 0 && lavaNear === 0 && fireNear === 0) g.anger = Math.max(0, g.anger - 0.15);
  if (g.anger > 100) g.anger = 100;

  const now = performance.now();
  if (g.anger > 40 && g.anger < 100 && now - g.lastAngerWarn > 4000) {
    g.lastAngerWarn = now;
    g.thought = g.anger > 75
      ? 'ЕЩЁ ОДНО СВЯТОТАТСТВО — И Я НИЗВЕРГНУ ТЕБЯ В АД!'
      : 'Остановись, смертный! Мои храмы неприкосновенны!';
  }
  if (g.anger >= 100) sendPlayerToHell();
}
function sendPlayerToHell() {
  if (!god) return;
  god.thought = 'ГНЕВ БОЖИЙ! СТУПАЙ В ГЕЕННУ ОГНЕННУЮ!';
  sfxGodWrath();
  const W = canvas.width, H = canvas.height;
  portal = { t0: performance.now(), cx: W / 2, cy: H / 2, rh: Math.min(W, H) * 0.15, switched: false, to: 2 };
  holdStart = 0; holdProg = 0;
  god = null;
  if (godMade) godMade.fill(0);
}
function sfxGodWrath() {
  if (!SFX.ac) return;
  sfxTone(80, 20, 3, 'sawtooth', 0.3);
  sfxNoise(3, 'lowpass', 2000, 60, 0.5, 0, 0.8);
  [523.25, 392.00, 261.63, 174.61].forEach((f, k) => sfxTone(f, f, 1.5, 'square', 0.08, k * 0.12));
  sfxTone(40, 15, 3.5, 'sine', 0.6);
}
function sfxGodAppear() {
  if (!SFX.ac) return;
  [261.63, 329.63, 392.00, 523.25, 659.25].forEach((f, k) => sfxTone(f, f, 2.0, 'sine', 0.07, k * 0.1));
  sfxTone(65.41, 130.81, 2.5, 'triangle', 0.12);
  sfxNoise(2, 'bandpass', 200, 2000, 0.12, 0, 2);
}
function sfxGodSmite() {
  if (!SFX.ac) return;
  sfxNoise(0.5, 'lowpass', 2000, 100, 0.4);
  sfxTone(120, 40, 0.6, 'sawtooth', 0.22);
  sfxTone(523.25, 261.63, 0.3, 'triangle', 0.08);
}
function drawGod(now) {
  if (!god) return;
  const g = god;
  const x = g.x, y = g.y;
  const t = now / 1000;
  const angerTint = Math.min(1, g.anger / 100);

  ctx.save();
  for (let i = 0; i < g.trail.length; i++) {
    const p = g.trail[i];
    const a = (i / g.trail.length) * 0.5;
    ctx.fillStyle = 'rgba(255,225,120,' + a.toFixed(2) + ')';
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.restore();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const rg = ctx.createRadialGradient(x, y - 30, 4, x, y - 30, 130);
  rg.addColorStop(0, 'rgba(255,245,200,0.35)');
  rg.addColorStop(0.5, 'rgba(255,215,120,0.15)');
  rg.addColorStop(1, 'rgba(255,200,60,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(x - 130, y - 160, 260, 260);
  ctx.restore();

  const haloY = y - 24;
  const haloR = 14;
  const pulse = 0.9 + 0.1 * Math.sin(t * 3);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const hg = ctx.createRadialGradient(x, haloY, 1, x, haloY, haloR * 2.2);
  hg.addColorStop(0, 'rgba(255,255,220,0.85)');
  hg.addColorStop(0.5, 'rgba(255,220,90,0.4)');
  hg.addColorStop(1, 'rgba(255,200,60,0)');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.arc(x, haloY, haloR * 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,250,200,' + (0.85 + 0.15 * Math.sin(t * 4)).toFixed(2) + ')';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ffd24a';
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.ellipse(x, haloY, haloR * pulse, haloR * 0.35 * pulse, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  const bodyCol = angerTint > 0.5 ? '#ff6a3a' : (angerTint > 0.2 ? '#ffb04a' : '#ffd24a');
  ctx.save();
  ctx.strokeStyle = bodyCol;
  ctx.fillStyle = bodyCol;
  ctx.lineWidth = 2;
  ctx.shadowColor = '#ffb820';
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + 16, y + 6); ctx.lineTo(x + 7, y + 10);
  ctx.lineTo(x + 12, y + 21); ctx.lineTo(x + 8, y + 23); ctx.lineTo(x + 3, y + 13);
  ctx.lineTo(x, y + 16); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff7d0';
  ctx.beginPath();
  ctx.moveTo(x + 3, y + 4);
  ctx.lineTo(x + 10, y + 7);
  ctx.lineTo(x + 6, y + 11);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.font = 'bold 12px Arial';
  const lb = 'БОГ' + (g.smites > 0 ? '  ⚔' + g.smites : '') + (g.builds > 0 ? '  ★' + g.builds : '');
  const w = ctx.measureText(lb).width;
  const barW = Math.max(w + 12, 130);
  ctx.fillStyle = 'rgba(60,40,0,0.85)';
  ctx.fillRect(x + 20, y - 44, barW, 34);
  ctx.strokeStyle = g.anger > 75 ? '#ff2200' : '#ffd24a';
  ctx.lineWidth = g.anger > 75 ? 2 : 1;
  ctx.strokeRect(x + 20, y - 44, barW, 34);
  ctx.fillStyle = '#ffe888';
  ctx.fillText(lb, x + 26, y - 30);

  const bx = x + 26, by = y - 24, bw = barW - 12, bh = 6;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(bx, by, bw, bh);
  const ag = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  ag.addColorStop(0, '#ffbb33');
  ag.addColorStop(1, '#ff2200');
  ctx.fillStyle = ag;
  ctx.fillRect(bx, by, bw * angerTint, bh);
  ctx.strokeStyle = g.anger > 75 ? '#ff2200' : '#8a5a10';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);
  if (g.anger > 5) {
    ctx.font = '9px Arial';
    ctx.fillStyle = g.anger > 75 ? '#ff6666' : '#ffcc88';
    ctx.fillText('ГНЕВ: ' + Math.round(g.anger) + '%', bx + bw + 4, by + 6);
  }
  if (g.thought) {
    ctx.font = '10px Arial';
    const tw = ctx.measureText(g.thought).width;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(x + 20, y + 4, tw + 12, 16);
    ctx.fillStyle = '#ffeaaa';
    ctx.fillText(g.thought, x + 26, y + 16);
  }
  ctx.restore();
}

// ===== ГЛАВНАЯ ОТРИСОВКА =====
function draw(now) {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!grid) return;
  bgT = (now || performance.now()) / 1000; cloudOff = Math.floor(bgT * 1.5) % cols;
  hellUpdate(now || performance.now());
  sfxFrame();
  for (let y = 0, i = 0; y < rows; y++) for (let x = 0; x < cols; x++, i++) px32[i] = cellColor(i, x, y);
  addGlow();
  bctx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (dim === 2) {
    const amp = 0.8 + hellE * CELL * 2.4;
    for (let y = 0; y < rows; y++) {
      const wgt = hellE > 0 ? 0.3 + 0.7 * Math.exp(-Math.pow((y - hellBand * rows * 1.25 + rows * 0.1) / (rows * 0.2), 2)) : 1;
      ctx.drawImage(buf, 0, y, cols, 1, Math.round(Math.sin(y * 0.45 - bgT * 6) * amp * wgt), y * CELL, cols * CELL, CELL);
    }
  } else ctx.drawImage(buf, 0, 0, cols * CELL, rows * CELL);

  drawBlackHole(now || performance.now());
  updateHellPortal(now || performance.now());
  updateGoldPortals(now || performance.now());
  dimUpdate(now || performance.now());
  drawDimFx(now || performance.now());
  drawElectric(now || performance.now());
  hellFx(now || performance.now());
  bossFx(now || performance.now());
  drawKeyAndPortal(now || performance.now());
  drawGoldPortals(now || performance.now());
  drawGod(now || performance.now());

  forEachAI(drawAICursor);

  if (sensorOn && !loupeOn) {
    const cx = Math.floor(mouseX / CELL), cy = Math.floor(mouseY / CELL);
    if (cx >= 0 && cx < cols && cy >= 0 && cy < rows) {
      const t = temp[idx(cx, cy)];
      const lb = Math.round(t) + '\u00b0C';
      ctx.font = 'bold 14px Arial';
      const w = ctx.measureText(lb).width;
      const bx = mouseX + 14, by = mouseY - 28;
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(bx, by, w + 12, 22);
      ctx.strokeStyle = tempColor(t);
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, w + 12, 22);
      ctx.fillStyle = tempColor(t);
      ctx.fillText(lb, bx + 6, by + 16);
    }
  }
  if (loupeOn) drawLoupe();
}

// ===== ГЛАВНЫЙ ЦИКЛ =====
function tick() {
  if (isDrawing) paintAt(mouseX, mouseY);
  applyWindSources();
  step();
  step();
  for (let i = 0; i < grid.length; i++) {
    if (grid[i] === SPAWNER) updateSpawner(i % cols, (i / cols) | 0, i);
  }
  updateTemperatures();
  freezeStep();
  if (simTick % 30 === 0) updateGoldPortalsScan();
  if (dim === 2 && boss) bossTick();
  if (god) { updateGod(); updateGodAnger(); }
  if (simTick % 12 === 0) sfxCount();
  if (bh) for (let k = 0; k < 4; k++) blackHoleStep();
  forEachAI(updateAICursor);
  if (explosionQueue.length > 0) {
    const q = explosionQueue;
    explosionQueue = [];
    for (const ex of q) explode(ex.x, ex.y, ex.r);
  }
  simTick++;
  if (simTick % 6 === 0) updateMissionProgress();
}
let lastTime = 0, acc = 0;
function loop(now) {
  const dt = lastTime ? now - lastTime : TICK_MS;
  lastTime = now;
  if (!paused && grid) {
    acc = Math.min(acc + dt, TICK_MS * 4);
    while (acc >= TICK_MS) { tick(); acc -= TICK_MS; }
  } else {
    acc = 0;
  }
  draw(now);
  requestAnimationFrame(loop);
}

// ===== ЗАПУСК =====
window.addEventListener('pointerdown', e => {
  sfxInit();
  if (e.target && e.target.closest && e.target.closest('button, #toolbar > *')) sfxClick();
});
window.addEventListener('keydown', e => {
  sfxInit();
  if (e.key === 'm' || e.key === 'M') { SFX.muted = !SFX.muted; if (SFX.master) SFX.master.gain.value = SFX.muted ? 0 : 0.8; }
});
$('btn-pause').addEventListener('click', () => sfxTone(paused ? 330 : 520, paused ? 220 : 780, 0.12, 'square', 0.04));

buildToolbar();
updateToolChip();
resize();
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);
requestAnimationFrame(loop);
</script>
