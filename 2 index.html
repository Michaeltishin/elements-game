<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Пиксельная песочница</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: Arial, sans-serif; }
    #canvas { display: block; }
    .ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      pointer-events: auto; /* важно: чтобы кнопки реально нажимались */
      user-select: none;
    }
    button {
      padding: 10px 16px;
      margin-right: 8px;
      cursor: pointer;
      background: #333;
      border: 2px solid #555;
      color: white;
      font-size: 14px;
      transition: background 0.2s, border-color 0.2s;
    }
    button:hover {
      background: #444;
      border-color: #777;
    }
    button:active {
      background: #222;
    }
    #tool {
      margin-left: 12px;
      font-weight: bold;
      text-transform: capitalize;
    }
  </style>
</head>
<body>
  <div class="ui">
    <button onclick="setTool('sand')">Песок</button>
    <button onclick="setTool('water')">Вода</button>
    <button onclick="setTool('plant')">Растение</button>
    <span id="tool">Песок</span>
  </div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const particles = [];
    let tool = 'sand';

    function setTool(t) {
      tool = t;
      document.getElementById('tool').textContent = t === 'sand' ? 'Песок' : t === 'water' ? 'Вода' : 'Растение';
    }

    class Particle {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = 0;
        this.type = type;
        this.size = 6; // размер пикселя
        this.active = true;
      }

      update() {
        if (!this.active) return;

        const floor = canvas.height - 10;

        // Гравитация только для песка и воды
        if (this.type === 'sand' || this.type === 'water') {
          this.vy += 0.8;
        }

        this.x += this.vx;
        this.y += this.vy;

        // Пол
        if (this.y >= floor) {
          this.y = floor;

          if (this.type === 'sand') {
            this.vy *= -0.3;
            this.vx *= 0.95;
            if (Math.abs(this.vy) < 0.2 && Math.abs(this.vx) < 0.2) {
              this.vy = 0;
              this.vx = 0;
            }
          } else if (this.type === 'water') {
            this.vy *= -0.1;
            this.vx *= 0.98;
            if (Math.abs(this.vy) < 0.1 && Math.abs(this.vx) < 0.1) {
              this.vy = 0;
              this.vx = 0;
            }
          }
        }
      }

      draw() {
        // Пиксельный стиль: квадратные ячейки
        ctx.fillStyle = this.type === 'sand' ? '#f4d03f' :
                        this.type === 'water' ? '#3498db' :
                        '#2ecc71';
        ctx.fillRect(
          Math.floor(this.x - this.size / 2),
          Math.floor(this.y - this.size / 2),
          this.size,
          this.size
        );
      }
    }

    // Растение: пиксельный столбик + листики
    function createPlant(x) {
      const baseY = canvas.height - 10;
      // Стебель
      for (let i = 0; i < 5; i++) {
        particles.push(new Particle(x, baseY - i * 12, 'plant'));
      }
      // Листики (делаем их чуть крупнее и в стороны)
      particles.push(new Particle(x - 12, baseY - 48, 'plant'));
      particles.push(new Particle(x + 12, baseY - 48, 'plant'));
    }

    let isDrawing = false;
    window.addEventListener('mousedown', () => isDrawing = true);
    window.addEventListener('mouseup', () => isDrawing = false);

    window.addEventListener('mousemove', e => {
      if (!isDrawing) return;
      for (let i = 0; i < 3; i++) {
        const dx = (Math.random() - 0.5) * 40;
        const dy = (Math.random() - 0.5) * 40;
        if (tool === 'plant') {
          createPlant(e.clientX + dx);
        } else {
          particles.push(new Particle(e.clientX + dx, e.clientY + dy, tool));
        }
      }
    });

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => p.update());
      particles.forEach(p => p.draw());
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
