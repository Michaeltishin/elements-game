function cycleMission() {
  currentMission = (currentMission + 1) % MISSIONS.length;
  const m = MISSIONS[currentMission];
  $('btn-mission').textContent = 'Миссия: ' + m.name;
  const p = $('missionPanel');
  if (currentMission === 0) { p.style.display = 'none'; return; }
  p.style.display = 'block';
  $('mpName').textContent = m.name;
  $('mpDesc').textContent = m.desc;
  restartMission();
}

function updateMissionProgress() {
  if (currentMission === 0) return;
  const m = MISSIONS[currentMission];
  if (missionState === 'run') {
    const pr = m.check(simTick);
    if (pr === -1) missionState = 'fail';
    else if (pr >= 1) missionState = 'done';
    else missionProgress = pr;
  }
  const f = $('mpFill'), s = $('mpStatus');
  if (missionState === 'fail') {
    f.style.width = '100%'; f.style.background = 'linear-gradient(90deg,#ff3333,#ff6633)';
    s.textContent = 'Растение погибло! Нажми на панель, чтобы начать заново.'; s.style.color = '#ff6666';
  } else if (missionState === 'done') {
    f.style.width = '100%'; f.style.background = 'linear-gradient(90deg,#33ff66,#3399ff)';
    s.textContent = 'Миссия выполнена!'; s.style.color = '#33ff66';
  } else {
    f.style.width = Math.min(missionProgress * 100, 100) + '%';
    f.style.background = 'linear-gradient(90deg,#33ff66,#3399ff)';
    s.textContent = (currentMission === 1 && !missionPlanted) ? 'Посади растение, и отсчёт начнётся' : 'Выполняется...';
    s.style.color = '#aaa';
  }
}
$('missionPanel').addEventListener('click', () => { if (currentMission !== 0) restartMission(); });

// ===== ЛУПА: подпись элемента под курсором =====
const NAME_RU = {};
NAME_RU[EMPTY] = 'Пусто (воздух)'; NAME_RU[SAND] = 'Песок'; NAME_RU[WATER] = 'Вода'; NAME_RU[PLANT] = 'Растение';
NAME_RU[FIRE] = 'Огонь'; NAME_RU[STONE] = 'Камень'; NAME_RU[ICE] = 'Лёд'; NAME_RU[LAVA] = 'Лава';
NAME_RU[SPAWNER] = 'Спавнер'; NAME_RU[STEAM] = 'Пар'; NAME_RU[OIL] = 'Масло'; NAME_RU[ACID] = 'Кислота';
NAME_RU[GUNPOWDER] = 'Порох'; NAME_RU[SMOKE] = 'Дым'; NAME_RU[WIND] = 'Ветер'; NAME_RU[IRON] = 'Железо';
NAME_RU[GOLD] = 'Золото'; NAME_RU[MOLTEN_IRON] = 'Расплавленное железо'; NAME_RU[MOLTEN_GOLD] = 'Расплавленное золото';
NAME_RU[WALL] = 'Стена (неразрушимая)';

function describeCell(i) {
  const g = grid[i];
  let s = NAME_RU[g] || ('Элемент №' + g);
  if (g === SPAWNER) s = spawnerType[i] ? ('Спавнер: ' + (NAME_RU[spawnerType[i]] || '?').toLowerCase()) : 'Спавнер (пустой)';
  else if (g === GUNPOWDER && life[i] > 0) s += ' (горит)';
  else if (g === STONE && life[i] > 0) s = 'Камень (свежая корка)';
  return s;
}

// Круглая линза с увеличенным участком мира рядом с курсором и подписью, что это за элемент
function drawLoupe() {
  const cx = Math.floor(mouseX / CELL), cy = Math.floor(mouseY / CELL);
  if (cx < 0 || cx >= cols || cy < 0 || cy >= rows) return;
  const SRC = 5, ZOOM = 4, R = SRC * CELL * ZOOM / 2;       // линза показывает 5x5 клеток
  let lx = mouseX + R + 22, ly = mouseY - R - 22;
  if (lx + R > canvas.width - 4) lx = mouseX - R - 22;
  if (lx - R < 4) lx = R + 4;
  if (ly - R < 4) ly = mouseY + R + 22;
  if (ly + R > canvas.height - 40) ly = Math.max(R + 4, canvas.height - R - 40);

  const sx = cx - (SRC >> 1), sy = cy - (SRC >> 1);
  const x0 = Math.max(0, sx), y0 = Math.max(0, sy), x1 = Math.min(cols, sx + SRC), y1 = Math.min(rows, sy + SRC);
  const k = CELL * ZOOM;
  ctx.save();
  ctx.beginPath(); ctx.arc(lx, ly, R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#101010'; ctx.fillRect(lx - R, ly - R, R * 2, R * 2);
  ctx.imageSmoothingEnabled = false;
  if (x1 > x0 && y1 > y0) {
    ctx.drawImage(buf, x0, y0, x1 - x0, y1 - y0, lx - R + (x0 - sx) * k, ly - R + (y0 - sy) * k, (x1 - x0) * k, (y1 - y0) * k);
  }
  ctx.restore();
  ctx.save();
  ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(lx, ly, R, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.strokeRect(lx - k / 2, ly - k / 2, k, k);               // выбранная клетка
  ctx.beginPath(); ctx.moveTo(mouseX, mouseY); ctx.lineTo(lx - (lx > mouseX ? R : -R) * 0.7, ly); ctx.stroke();   // "ручка" лупы
  ctx.restore();

  let label = describeCell(idx(cx, cy));
  if (sensorOn) label += '   ' + Math.round(temp[idx(cx, cy)]) + '\u00b0C';
  ctx.save();
  ctx.font = 'bold 13px Arial';
  const w = ctx.measureText(label).width;
  let bx = lx - w / 2 - 8;
  bx = Math.max(4, Math.min(canvas.width - w - 20, bx));
  const by = ly + R + 8;
  ctx.fillStyle = 'rgba(0,0,0,0.88)';
  ctx.fillRect(bx, by, w + 16, 22);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, w + 16, 22);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(label, bx + 8, by + 16);
  ctx.restore();
}

// ===== ОТРИСОВКА =====
function cellColor(i) {
  switch (grid[i]) {
    case EMPTY: {
      const t = temp[i];
      if (t > 100) {
        const a = Math.min((t - 100) / 700, 0.15);
        return mix(255, (100 + 100 * a) | 0, 0, a);
      }
      return C_BG;
    }
    case FIRE:      return fireColor(life[i]);
    case SAND:      return C_SAND;
    case WATER:     return C_WATER;
    case PLANT:     return C_PLANT;
    case STONE:     return stoneColor(temp[i]);
    case WALL: {                                   // кирпичная кладка
      const wx = i % cols, wy = (i / cols) | 0;
      if (wy % 3 === 0 || (wx + (((wy / 3) | 0) & 1) * 3) % 6 === 0) return C_WALL_MORTAR;
      return C_WALL_BRICK[Math.imul(i, 2654435761) >>> 30];
    }
    case IRON:      return metalColor(i, false, temp[i]);
    case GOLD:      return metalColor(i, true, temp[i]);
    case MOLTEN_IRON:
    case MOLTEN_GOLD: return moltenColor(grid[i], temp[i]);
    case ICE:       return iceColor(temp[i]);
    case LAVA:      return lavaColor(temp[i]);
    case SPAWNER:   return SPAWNER_COL[spawnerType[i]];
    case STEAM:     return mix(200, 220, 240, Math.min(life[i] / 100, 0.6));
    case OIL:       return C_OIL;
    case ACID:      return C_ACID;
    case GUNPOWDER: return gunpowderColor(life[i]);
    case SMOKE:     return mix(100, 100, 100, Math.min(life[i] / 60, 0.5));
    case WIND:      return windColor();
    default:        return C_UNKNOWN;
  }
}

function draw() {
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!grid) return;
  // Весь мир рисуется одним drawImage вместо десятков тысяч fillRect
  const n = cols * rows;
  for (let i = 0; i < n; i++) px32[i] = cellColor(i);
  bctx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, cols * CELL, rows * CELL);

  forEachAI(drawAICursor);

  if (sensorOn && !loupeOn) {
    const cx = Math.floor(mouseX / CELL), cy = Math.floor(mouseY / CELL);
    if (cx >= 0 && cx < cols && cy >= 0 && cy < rows) {
      const t = temp[idx(cx, cy)];
      const lb = Math.round(t) + '\u00b0C';
      ctx.font = 'bold 14px Arial';
      const w = ctx.measureText(lb).width;
      const bx = mouseX + 14, by = mouseY - 28;
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(bx, by, w + 12, 22);
      ctx.strokeStyle = tempColor(t);
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, w + 12, 22);
      ctx.fillStyle = tempColor(t);
      ctx.fillText(lb, bx + 6, by + 16);
    }
  }
  if (loupeOn) drawLoupe();
}

// ===== ГЛАВНЫЙ ЦИКЛ =====
function tick() {
  // Пока кнопка зажата, материал продолжает сыпаться даже если мышь не двигается
  if (isDrawing) paintAt(mouseX, mouseY);
  applyWindSources();
  step();
  step();
  for (let i = 0; i < grid.length; i++) {
    if (grid[i] === SPAWNER) updateSpawner(i % cols, (i / cols) | 0, i);
  }
  updateTemperatures();
  forEachAI(updateAICursor);
  if (explosionQueue.length > 0) {
    const q = explosionQueue;
    explosionQueue = [];
    for (const ex of q) explode(ex.x, ex.y, ex.r);
  }
  simTick++;
  if (simTick % 6 === 0) updateMissionProgress();
}

let lastTime = 0, acc = 0;
function loop(now) {
  const dt = lastTime ? now - lastTime : TICK_MS;
  lastTime = now;
  if (!paused && grid) {
    // Фиксированный шаг: скорость игры не зависит от частоты монитора (раньше на 144 Гц всё шло в 2,4 раза быстрее)
    acc = Math.min(acc + dt, TICK_MS * 4);
    while (acc >= TICK_MS) { tick(); acc -= TICK_MS; }
  } else {
    acc = 0;
  }
  draw();
  requestAnimationFrame(loop);
}

// ===== ЗАПУСК =====
buildToolbar();
resize();
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);
requestAnimationFrame(loop);
</script>
